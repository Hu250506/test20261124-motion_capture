# Vision Action Platform: 5개 서비스
#   postgres  영구 DB (사용자·분석 작업·사람별 예측)
#   redis     Celery 작업 대기열
#   fastapi   AI 추론 (YOLO Pose + 17개 동작 RandomForest)
#   django    웹 화면·회원·DRF API·관리자
#   celery    비동기 분석 실행 (영상 확보 → FastAPI 호출 → ORM 저장)
# 컨테이너끼리는 localhost가 아니라 서비스 이름(postgres, redis, fastapi)으로 접속한다.
name: vision_action_platform

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  AI_SERVICE_URL: http://fastapi:8001
  MEDIA_ROOT: /app/media

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fastapi:
    build:
      context: ./ai_service
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      MAX_VIDEO_SECONDS: ${MAX_VIDEO_SECONDS:-60}
    ports:
      - "8001:8001"   # 개발용 Swagger(/docs) 확인. 배포 시에는 제거해도 됩니다.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  django:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120"
    env_file: .env
    environment: *backend-env
    volumes:
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery:
    build: ./backend
    command: celery -A config worker -l info --concurrency=1
    env_file: .env
    environment: *backend-env
    volumes:
      - media_data:/app/media   # django가 저장한 업로드 영상을 같은 경로에서 읽는다
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
